<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro de cliente | REDXela</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5" style="max-width: 34rem">
    <h1 class="h2">Crear cuenta de cliente</h1>
    <div th:if="${registrationError}" class="alert alert-danger" th:text="${registrationError}"></div>
    <div class="card"><div class="card-body">
        <form method="post" th:action="@{/customer/register}" class="vstack gap-3">
            <div><label for="name" class="form-label">Nombre</label>
                <input id="name" name="name" class="form-control" maxlength="100" autocomplete="name" required></div>
            <div><label for="email" class="form-label">Correo electrónico</label>
                <input id="email" name="email" type="email" class="form-control" autocomplete="email" required></div>
            <div><label for="password" class="form-label">Contraseña</label>
                <input id="password" name="password" type="password" class="form-control" minlength="8" maxlength="72" autocomplete="new-password" required>
                <div class="form-text">Use al menos 8 caracteres.</div></div>
            <button class="btn btn-primary" type="submit">Crear cuenta</button>
        </form>
    </div></div>
    <p class="mt-3"><a th:href="@{/customer/login}">Volver al acceso de clientes</a></p>
</main>
</body>
</html>
