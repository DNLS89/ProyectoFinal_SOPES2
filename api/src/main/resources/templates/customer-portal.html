<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Portal de clientes | REDXela</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4">
    <header class="d-flex justify-content-between align-items-start gap-3 flex-wrap mb-4">
        <div><h1>Portal de clientes</h1><p class="text-secondary mb-0">Bienvenido, <strong th:text="${customerName}">Cliente</strong> · <span th:text="${account.email}">correo</span></p></div>
        <form method="post" th:action="@{/logout}"><button class="btn btn-outline-secondary" type="submit">Cerrar sesión</button></form>
    </header>

    <div th:if="${portalMessage}" class="alert alert-success" role="status" th:text="${portalMessage}"></div>
    <div th:if="${portalError}" class="alert alert-danger" role="alert" th:text="${portalError}"></div>

    <section class="card mb-4"><div class="card-body">
        <h2 class="h4">Crear pedido</h2>
        <form method="post" th:action="@{/portal/orders}" id="customer-order-form" class="vstack gap-3">
            <div><label for="serviceLevel" class="form-label">Nivel de servicio</label>
                <select class="form-select" id="serviceLevel" name="serviceLevel" required>
                    <option th:each="level : ${serviceLevels}" th:value="${level.name()}"
                            th:text="|${level.displayName} (${level.targetWaitMinutes} min objetivo)|"></option>
                </select></div>
            <div class="table-responsive"><table class="table table-sm align-middle mb-0">
                <thead><tr><th>Producto</th><th>Mercancía</th><th>Unidades</th><th></th></tr></thead>
                <tbody id="customer-order-lines"><tr>
                    <td><select class="form-select portal-product" name="productCodes" required>
                        <option value="">Seleccione producto</option>
                        <option th:each="product : ${products}" th:value="${product.code}"
                                th:attr="data-type=${product.merchandiseType.name}"
                                th:text="|${product.code} — ${product.name}|"></option>
                    </select></td>
                    <td><span class="portal-product-type">Seleccione producto</span></td>
                    <td><input class="form-control" type="number" name="quantities" min="1" value="1" required></td>
                    <td><button type="button" class="btn btn-sm btn-outline-danger remove-portal-line" disabled>Quitar</button></td>
                </tr></tbody>
            </table></div>
            <div class="d-flex gap-2"><button type="button" id="add-portal-line" class="btn btn-outline-secondary">Agregar producto</button>
                <button type="submit" class="btn btn-primary">Enviar pedido</button></div>
        </form>
    </div></section>

    <section class="card"><div class="card-body">
        <h2 class="h4">Mis pedidos</h2>
        <p class="small text-secondary">Los estados se actualizan automáticamente.</p>
        <div class="table-responsive"><table class="table table-striped align-middle mb-0">
            <thead><tr><th>Pedido</th><th>Estado</th><th>Servicio</th><th>Unidades</th><th>Progreso</th><th>Creado</th><th>Productos</th></tr></thead>
            <tbody id="customer-orders"><tr th:each="order : ${orders}">
                <td th:text="${order.id}">ID</td><td th:text="${order.status.displayName}">Estado</td>
                <td th:text="${order.serviceLevel.displayName}">Servicio</td><td th:text="${order.totalUnits}">0</td>
                <td th:text="|${order.progressPercent}%|">0%</td><td th:text="${order.createdAt}">Fecha</td>
                <td><details><summary>Ver productos</summary><ul class="mb-0 ps-3">
                    <li th:each="line : ${order.lines}" th:text="|${line.productName} (${line.productCode}) — ${line.quantity} unidades — ${line.merchandiseType.name}|">Producto</li>
                </ul></details></td>
            </tr><tr th:if="${#lists.isEmpty(orders)}"><td colspan="7" class="text-secondary">Aún no tiene pedidos.</td></tr></tbody>
        </table></div>
    </div></section>
</main>
<script>
    const rows = document.getElementById('customer-order-lines');
    function updateRemoveButtons() {
        const lines = rows.querySelectorAll('tr');
        lines.forEach(line => line.querySelector('.remove-portal-line').disabled = lines.length === 1);
    }
    document.getElementById('add-portal-line').addEventListener('click', () => {
        const line = rows.querySelector('tr').cloneNode(true);
        line.querySelector('select').selectedIndex = 0;
        line.querySelector('input').value = '1';
        line.querySelector('.portal-product-type').textContent = 'Seleccione producto';
        rows.appendChild(line);
        updateRemoveButtons();
    });
    rows.addEventListener('click', event => {
        const button = event.target.closest('.remove-portal-line');
        if (button && rows.querySelectorAll('tr').length > 1) {
            button.closest('tr').remove();
            updateRemoveButtons();
        }
    });
    rows.addEventListener('change', event => {
        if (event.target.matches('.portal-product')) {
            event.target.closest('tr').querySelector('.portal-product-type').textContent = event.target.selectedOptions[0]?.dataset.type || 'Tipo';
        }
    });
    function renderOrders(orders) {
        const body = document.getElementById('customer-orders');
        body.replaceChildren();
        if (!orders.length) {
            const row = body.insertRow();
            const cell = row.insertCell();
            cell.colSpan = 7;
            cell.className = 'text-secondary';
            cell.textContent = 'Aún no tiene pedidos.';
            return;
        }
        orders.forEach(order => {
            const row = body.insertRow();
            [order.id, order.status, order.serviceLevel, order.units, `${order.progressPercent}%`,
                order.createdAt ? new Date(order.createdAt).toLocaleString() : '—'].forEach(value => row.insertCell().textContent = value);
            const detailsCell = row.insertCell();
            const details = document.createElement('details');
            const summary = document.createElement('summary');
            summary.textContent = 'Ver productos';
            details.appendChild(summary);
            const list = document.createElement('ul');
            list.className = 'mb-0 ps-3';
            order.lines.forEach(line => {
                const item = document.createElement('li');
                item.textContent = `${line.productName} (${line.productCode}) — ${line.quantity} unidades — ${line.merchandiseType}`;
                list.appendChild(item);
            });
            details.appendChild(list);
            detailsCell.appendChild(details);
        });
    }
    async function refreshOrders() {
        try {
            const response = await fetch('/portal/state', {cache: 'no-store', headers: {'Accept': 'application/json'}});
            if (response.ok) renderOrders(await response.json());
        } catch (error) {
            // La siguiente consulta vuelve a intentarlo sin alterar el formulario.
        }
    }
    updateRemoveButtons();
    window.setInterval(refreshOrders, 3000);
</script>
</body>
</html>
