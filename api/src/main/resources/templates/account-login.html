<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acceso | REDXela</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5" style="max-width: 30rem">
    <h1 class="h2">REDXela</h1>
    <p class="text-secondary" th:text="|Acceso de ${audience}|">Acceso</p>
    <div th:if="${registrationMessage}" class="alert alert-success" th:text="${registrationMessage}"></div>
    <div th:if="${loginError}" class="alert alert-danger" th:text="${loginError}"></div>
    <div class="card"><div class="card-body">
        <form method="post" th:action="@{/login}" class="vstack gap-3">
            <input type="hidden" name="audience" th:value="${audience}">
            <div><label for="email" class="form-label">Correo electrónico</label>
                <input id="email" name="email" type="email" class="form-control" autocomplete="username" required></div>
            <div><label for="password" class="form-label">Contraseña</label>
                <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required></div>
            <button class="btn btn-primary" type="submit">Iniciar sesión</button>
        </form>
    </div></div>
    <p class="mt-3 mb-1" th:if="${audience == 'cliente'}">¿No tiene cuenta? <a th:href="@{/customer/register}">Registrarse</a></p>
    <p class="mt-3 mb-1" th:if="${audience == 'operador'}">¿Es cliente? <a th:href="@{/customer/login}">Ir al portal de clientes</a></p>
    <p th:if="${audience == 'cliente'}"><a th:href="@{/operator/login}">Acceso de operador</a></p>
</main>
</body>
</html>
